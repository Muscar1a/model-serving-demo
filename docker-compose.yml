services:
    kafka:
        image: confluentinc/cp-kafka:7.6.1
        container_name: stream-project-kafka
        hostname: stream-project-kafka
        ports:
            - "9092:9092"
            - "19092:19092"
        environment:
            KAFKA_NODE_ID: 1
            CLUSTER_ID: ${KAFKA_CLUSTER_ID}
            KAFKA_PROCESS_ROLES: "broker,controller"
            KAFKA_CONTROLLER_QUORUM_VOTERS: "1@stream-project-kafka:9093"
            KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

            KAFKA_LISTENERS: "PLAINTEXT_HOST://0.0.0.0:9092,PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093"
            KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9092,PLAINTEXT://stream-project-kafka:19092"
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
            KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
            KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
        volumes:
            - kafka_data:/tmp/kraft-combined-logs
        networks:
            - stream-network
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1",
                ]
            interval: 10s
            timeout: 10s
            retries: 5

    kafka-ui:
        image: provectuslabs/kafka-ui:latest
        container_name: stream-project-kafka-ui
        depends_on:
            - kafka
        ports:
            - "18080:8080"
        environment:
            KAFKA_CLUSTERS_0_NAME: stream-project
            KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: stream-project-kafka:19092
        networks:
            - stream-network

    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
        container_name: stream-project-elasticsearch
        environment:
            - discovery.type=single-node
            - xpack.security.enabled=false
            - "ES_JAVA_OPTS=${ES_JAVA_MEM}"
        ports:
            - "19200:9200"
            - "19300:9300"
        networks:
            - stream-network
        healthcheck:
            test:
                ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 5
        volumes:
            - es-data:/usr/share/elasticsearch/data

    seaweedfs:
        image: chrislusf/seaweedfs:latest
        container_name: stream-project-seaweedfs
        hostname: stream-project-seaweedfs
        ports:
            - "19000:8333"
            - "19001:8888"
            - "19333:9333"
        environment:
            AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
            AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
            S3_BUCKET: ${S3_BUCKET_NAME}
        command: "mini -dir=/data"
        networks:
            - stream-network
        volumes:
            - seaweedfs-data:/data
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:9333/cluster/status"]
            interval: 15s
            timeout: 10s
            retries: 5
            start_period: 5s

    spark:
        build:
            context: .
            dockerfile: spark/Dockerfile
        container_name: stream-project-spark
        depends_on:
            - kafka
            - elasticsearch
            - seaweedfs
        environment:
            - KAFKA_BOOTSTRAP_SERVERS=stream-project-kafka:19092
            - KAFKA_TOPIC=heart-disease-stream
            - ES_NODES=stream-project-elasticsearch
            - ES_PORT=9200
            - ES_INDEX=heart-disease-stream
            - S3_ENDPOINT=${S3_ENDPOINT:-http://stream-project-seaweedfs:8333}
            - S3_ACCESS_KEY=${S3_ACCESS_KEY}
            - S3_SECRET_KEY=${S3_SECRET_KEY}
            - S3_BUCKET=${S3_BUCKET_NAME}
        networks:
            - stream-network
        volumes:
            - ./spark:/app/spark
            - ./spark/checkpoint:/app/spark/checkpoint
        command: tail -f /dev/null

networks:
    stream-network:
        driver: bridge

volumes:
    kafka_data:
        driver: local
    es-data:
        driver: local
    seaweedfs-data:
        driver: local
